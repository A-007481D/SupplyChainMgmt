name: Java CI with Maven

on:
  push:
    branches: [ main, develop, 'feature/*', 'bugfix/*', 'hotfix/*', 'release/*' ]
  pull_request:
    branches: [ main, develop, spring-boot-version ]

env:
  MAVEN_OPTS: -Djava.security.egd=file:/dev/./urandom -Dspring.profiles.active=ci
  IMAGE_NAME: manage-supplier-orders
  CONTAINER_REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set version (short SHA)
        id: version
        run: echo "VERSION=${GITHUB_SHA::8}" >> $GITHUB_ENV

      - name: Set up repo owner
        id: repo
        run: echo "repo_owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      - name: Run tests
        run: mvn test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/testdb
          SPRING_DATASOURCE_USERNAME: test
          SPRING_DATASOURCE_PASSWORD: test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        uses: docker/login-action@v2
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        uses: docker/build-push-action@v4
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.CONTAINER_REGISTRY }}/${{ steps.repo.outputs.repo_owner }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.CONTAINER_REGISTRY }}/${{ steps.repo.outputs.repo_owner }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
