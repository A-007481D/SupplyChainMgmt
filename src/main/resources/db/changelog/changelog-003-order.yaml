databaseChangeLog:
  - changeSet:
      id: 003-create-supplier-order
      author: A-007481D
      changes:
        - createTable:
            tableName: supplier_order
            ifNotExists: true
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: supplier_id
                  type: BIGINT
              - column:
                  name: order_date
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: status
                  type: VARCHAR(50)
              - column:
                  name: total_amount
                  type: NUMERIC(18,2)

  - changeSet:
      id: 003-create-supplier-order-item
      author: A-007481D
      changes:
        - createTable:
            tableName: supplier_order_item
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: supplier_order_id
                  type: BIGINT
              - column:
                  name: product_id
                  type: BIGINT
              - column:
                  name: quantity
                  type: INTEGER
              - column:
                  name: unit_price
                  type: NUMERIC(18,2)
              - column:
                  name: subtotal
                  type: NUMERIC(18,2)
        - addForeignKeyConstraint:
            baseTableName: supplier_order_item
            baseColumnNames: supplier_order_id
            referencedTableName: supplier_order
            referencedColumnNames: id
            constraintName: fk_soi_supplier_order
