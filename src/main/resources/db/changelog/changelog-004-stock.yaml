databaseChangeLog:
  - changeSet:
      id: 004-create-stock-movement
      author: A-007481D
      changes:
        - createTable:
            tableName: stock_movement
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: product_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: unit_cost
                  type: numeric(12,2)
              - column:
                  name: total_cost
                  type: numeric(12,2)
              - column:
                  name: supplier_order_id
                  type: bigint
              - column:
                  name: movement_date
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
